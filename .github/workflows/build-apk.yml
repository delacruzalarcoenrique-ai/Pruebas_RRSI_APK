name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para crear/actualizar la Release
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar paquetes del SDK
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon

      - name: Subir APK (artifact de respaldo)
        uses: actions/upload-artifact@v4
        with:
          name: winet-senal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK en Release "latest" (enlace de descarga directo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recrea la release "latest" para que el tag apunte al commit actual
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "W-NET Señal — último APK" \
            --notes "APK debug generado automáticamente desde el commit ${GITHUB_SHA}. Descárgalo directo: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
